services:
  postgres:
    image: postgres:16-alpine
    container_name: social-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - '5432:5432'
    volumes:
      - social-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U social -d social']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social-platform-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - social-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  media-worker:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379

volumes:
  social-postgres-data:
  social-redis-data:
